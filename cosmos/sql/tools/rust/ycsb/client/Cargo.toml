[package]
name = "ycsb-cosmos"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Rust port of the YCSB core workload and the Azure Cosmos DB (NoSQL) binding"
license = "Apache-2.0"
publish = false

[[bin]]
name = "ycsb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
azure_data_cosmos = { version = "=1.0.0-beta.1", features = ["key_auth", "control_plane", "preview_patch"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
hdrhistogram = { version = "7.5", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
debug = "line-tables-only"

# Properties for the Rust YCSB client's azurecosmos binding. The keys are the same as the Java
# binding's (Azure/YCSB), so cosmos/scripts/azurecosmos-run.sh can fill them in with sed; keep
# every key on its own "# key = value" line. Notes call out where the Rust SDK differs.

# Azure Cosmos DB host uri (ex: https://p3rf.documents.azure.com:443/) and primary key.
# azurecosmos.primaryKey =
# azurecosmos.uri =

# Database to be used, if not specified 'ycsb' will be used.
# azurecosmos.databaseName = ycsb

# Set to true to allow inserts to update existing documents.
# If this is false and a document already exists, the insert will fail.
# "true" or "false"
# azurecosmos.useUpsert = false

# Log the full error (with SDK diagnostics) instead of a one-line summary when an operation fails.
# The default is false to reduce output size.
# azurecosmos.includeExceptionStackInLog = false

# Log request diagnostics for operations slower than this many milliseconds.
# The default is -1 (no diagnostics at all) to reduce output size.
# azurecosmos.diagnosticsLatencyThresholdInMS = -1

# The value to be appended to the user-agent header (at most 25 header-safe characters).
# In most cases, you should leave this as "azurecosmos-ycsb".
# azurecosmos.userAgent = azurecosmos-ycsb

# How updates are applied (Rust client only):
#   replace - read the item, then replace it if its ETag is unchanged, up to 4 attempts
#             (the brianfrankcooper/YCSB binding).
#   patch   - one server-side PATCH with a replace operation per field (the Azure/YCSB binding,
#             used by the Java recipes). At most 10 fields per update.
# azurecosmos.updateMode = replace

# Cosmos binary JSON on the wire (Rust client only). The Rust SDK enables it by default; the
# client turns it off automatically for localhost endpoints because the Linux emulator rejects it.
# azurecosmos.binaryEncoding = true

# Skip the SDK's automatic session token tracking (Rust client only). Reads then carry no session
# token, so read-your-writes is not guaranteed; meant for read-only runs at SESSION consistency.
# azurecosmos.sessionCapturingDisabled = false

# CONNECTION OPTIONS

# The Rust SDK has no direct (TCP) mode. With useGateway=false (the default) requests use
# Gateway 2.0 when the account advertises it, otherwise the standard gateway; with
# useGateway=true they always use the standard gateway.
# azurecosmos.useGateway = false

# Specify consistency level.
# If not specified, session level will be used by default.
# Values can be STRONG, BOUNDED_STALENESS, SESSION, CONSISTENT_PREFIX, or EVENTUAL.
# The Rust SDK sets read consistency per request instead: STRONG -> GlobalStrong,
# BOUNDED_STALENESS -> LatestCommitted, SESSION -> Session, CONSISTENT_PREFIX and EVENTUAL -> Eventual.
# azurecosmos.consistencyLevel = SESSION

# Set the maximum number of retries in the case where the request fails due to rate limiting.
# If not specified, the Java SDK default of 9 is used (the Rust SDK's own default is higher).
# azurecosmos.maxRetryAttemptsOnThrottledRequests = 0

# Set the maximum cumulative wait in seconds across rate-limit retries.
# If not specified, the Java SDK default of 30 seconds is used.
# azurecosmos.maxRetryWaitTimeInSeconds = 30

# Maximum idle connections kept per endpoint for the standard gateway (the Rust HTTP client
# does not cap concurrent connections).
# azurecosmos.gatewayMaxConnectionPoolSize = 30

# Maximum HTTP/2 connections per endpoint for Gateway 2.0.
# azurecosmos.directMaxConnectionsPerEndpoint = -1

# Sets the value of the timeout in seconds for an idle connection in gateway mode. After that time, the connection will be automatically closed.
# The default is 60 seconds.
# azurecosmos.gatewayIdleConnectionTimeoutInSeconds = 60

# Idle timeout in seconds for Gateway 2.0 (HTTP/2) connections.
# azurecosmos.directIdleConnectionTimeoutInSeconds = 60


# QUERY OPTIONS

# Not supported by the Rust SDK (logged and ignored if set).
# azurecosmos.maxDegreeOfParallelism = 0

# Not supported by the Rust SDK (logged and ignored if set).
# azurecosmos.maxBufferedItemCount = 0

# Sets the preferred page size when scanning.
# Default value is -1.
# azurecosmos.preferredPageSize = -1

# output file location
# exportfile =

# Not supported by the Rust client (logged and ignored if set).
# azurecosmos.appInsightConnectionString =

# Sets the comma separated preferred region list, e.g. "East US,West US 2".
# Default value is null (the account's region order).
# azurecosmos.preferredRegionList =
